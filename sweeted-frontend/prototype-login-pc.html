<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sweeted — Connexion · ISPM (prototype PC)</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/latin-400-normal.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/latin-600-normal.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/latin-700-normal.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/latin-800-normal.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/kalam@5.0.16/latin-400-normal.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/kalam@5.0.16/latin-700-normal.min.css" rel="stylesheet"/>
<style>
/* ============================================================
   SWEETED · PROTOTYPE PAGE DE CONNEXION PC — 2 colonnes
   DA de l'app (vert #00B43C) + touche scolaire "MV Boli"
   Logo officiel ISPM : assets/ispm.png
   ============================================================ */
:root{
  --green:#00B43C; --green-dk:#009A32; --green-deep:#007A2E;
  --green-lt:#3BCC7C; --green-pale:#B5E8C4; --green-wash:#E8F5EC;
  --ink:#132A1E; --ink-2:#41564A; --mut:#7C8D82;
  --paper:#FFFFFF; --bg:#F4F7F4; --rule:#E3EFE6; --margin:#E5A3A0;
  --gold:#F5B800; --gold-wash:#FFF6DE; --gold-ink:#8A6D00;
  --f-ui:'Inter',system-ui,sans-serif;
  --f-hand:'Kalam',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--green-pale);color:var(--green-deep)}
body{
  font-family:var(--f-ui); color:var(--ink); min-height:100vh;
  background:var(--bg);
}
.hand{font-family:var(--f-hand)}

/* ================= MISE EN PAGE ================= */
.page{
  position:relative; z-index:1; min-height:100vh;
  display:grid; grid-template-columns:1fr 1fr;
  align-items:stretch; gap:clamp(30px,4.5vw,80px);
  max-width:1440px; margin:0 auto;
  padding:clamp(28px,4vh,56px) clamp(20px,4vw,64px);
}

/* ================= COLONNE GAUCHE : PRÉSENTATION ================= */
.pres{display:flex; flex-direction:column; gap:48px; position:relative}

.pres-card{
  position:relative; background:var(--paper);
  border:1px solid #E7EFE8; border-radius:18px;
  padding:26px 30px 24px;
  box-shadow:0 2px 6px rgba(19,42,30,.05), 0 14px 34px -18px rgba(19,42,30,.18);
  animation:pop .7s cubic-bezier(.22,1,.36,1) both;
}
.pres-card.official{animation-delay:.08s}
.pres-card.student{animation-delay:.22s}
@keyframes pop{from{opacity:0;transform:translateY(22px) rotate(-.6deg)}to{opacity:1;transform:none}}

/* morceau de scotch */
.tape{
  position:absolute; top:-13px; left:50%; width:112px; height:26px;
  transform:translateX(-50%) rotate(-3deg);
  background:linear-gradient(rgba(181,232,196,.8),rgba(181,232,196,.8));
  box-shadow:0 3px 6px rgba(19,42,30,.12);
  clip-path:polygon(3% 0,97% 4%,100% 96%,0 100%);
}
.tape.gold{background:linear-gradient(rgba(245,184,0,.42),rgba(245,184,0,.42)); transform:translateX(-50%) rotate(2.5deg)}

.pres-tag{
  display:inline-flex; align-items:center; gap:7px;
  font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:5px 12px; border-radius:999px;
  background:var(--green-wash); color:var(--green-deep); border:1px solid #CBEAD6;
}
.pres-tag.gold{background:var(--gold-wash); color:var(--gold-ink); border-color:#EAD9A0}
.pres-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}

.pres-row{display:flex; align-items:center; gap:20px; margin-top:16px}

/* vrai logo Sweeted (sticker, comme ISPM) */
.sweeted-logo{
  flex-shrink:0; width:138px; height:96px; object-fit:contain; background:#fff;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.16));
  transform:rotate(2deg);
  animation:floaty 6s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}

/* vrai logo ISPM (assets/ispm.png) présenté comme un sticker */
.ispm-logo{
  flex-shrink:0; width:104px; height:104px; object-fit:cover;
  border-radius:24px; background:#fff;
  border:3px solid #fff; outline:2px solid rgba(0,180,60,.35);
  box-shadow:0 10px 24px -8px rgba(0,122,46,.45);
  transform:rotate(-3deg);
  animation:floaty 6s ease-in-out infinite;
}

.pres-card h2{
  font-family:var(--f-hand); font-weight:700;
  font-size:clamp(1.3rem,1.9vw,1.62rem); line-height:1.28; color:var(--ink);
}
/* présentation officielle : sobre et professionnelle */
.pres-card h2.pro{
  font-family:var(--f-ui); font-weight:800;
  font-size:clamp(1.2rem,1.7vw,1.5rem); line-height:1.4; letter-spacing:-0.01em;
}

/* ================= COLONNE DROITE : FORMULAIRE ================= */
.auth{position:relative; width:min(520px,100%); justify-self:center}

.card{
  border-radius:22px; overflow:hidden; background:var(--paper);
  box-shadow:0 3px 8px rgba(19,42,30,.06), 0 30px 60px -24px rgba(19,42,30,.28);
  animation:pop .7s cubic-bezier(.22,1,.36,1) .15s both;
}
/* bandeau logo, comme dans l'app */
.card-head{
  background:var(--green);
  padding:42px 20px; display:grid; place-items:center;
}
.card-head img{width:160px; height:160px; object-fit:contain}
.card-head .motto{
  margin-top:16px; color:#fff; text-align:center;
  font-family:var(--f-ui); font-size:.8rem; font-weight:800; letter-spacing:.22em;
  opacity:.8;
}

.card-body{padding:28px; background:#F5F5F7}

/* toggle Connexion / Inscription (comme dans l'app) */
.tabs{
  display:flex; background:var(--green-lt); border-radius:25px;
  height:54px; margin-bottom:24px; overflow:hidden;
}
.tab{
  flex:1; border:0; cursor:pointer; border-radius:25px;
  font-family:var(--f-ui); font-size:.95rem; font-weight:600; color:#fff;
  background:transparent; display:grid; place-items:center;
}
.tab.on{background:var(--green-dk); font-weight:800}

.field{margin-bottom:0}
.field .lab{margin:0 2px 6px}
.field label{font-size:.85rem; font-weight:700; color:var(--ink)}
.inp{
  display:flex; align-items:center; gap:11px; height:56px; padding:0 12px;
  background:#F0F2F5; border-radius:10px; margin-bottom:18px;
}
.inp svg.ic{width:22px;height:22px;color:#6A6A6A;flex-shrink:0}
.inp input{flex:1; min-width:0; border:0; outline:0; background:none; height:100%;
  font-family:var(--f-ui); font-size:.92rem; color:var(--ink); margin-left:10px}
.inp input::placeholder{color:#999}
.eye{border:0;background:none;cursor:pointer;padding:5px;border-radius:8px;color:#6A6A6A;display:grid;place-items:center}
.eye svg{width:22px;height:22px}

.submit{
  width:100%; height:60px; margin-top:12px; border:0; cursor:pointer; border-radius:30px;
  background:var(--green); color:#fff; font-family:var(--f-ui); font-size:1.1rem; font-weight:800;
}
.submit:hover{background:var(--green-dk)}


/* ================= RESPONSIVE ================= */
@media (max-width:1080px){
  .page{grid-template-columns:1fr; gap:34px}
  .auth{order:-1}
  .pres{display:grid; grid-template-columns:1fr 1fr; gap:18px}
}
@media (max-width:680px){
  .pres{grid-template-columns:1fr}
  .pres-card{padding:22px}
  .pres-row{flex-direction:column; align-items:flex-start; gap:12px}
  .ispm-logo{width:88px;height:88px}
}
</style>
</head>
<body>

<main class="page">

  <!-- ============ GAUCHE : PRÉSENTATION ============ -->
  <aside class="pres">

    <!-- Haut : partie OFFICIELLE -->
    <section class="pres-card official">
      <span class="tape gold"></span>
      <span class="pres-tag gold"><i></i>Partie officielle</span>
      <div class="pres-row">
        <!-- Vrai logo ISPM -->
        <img class="ispm-logo" src="assets/ispm.png" alt="Logo ISPM"/>
        <div>
          <h2 class="pro">Soyez informé des dernières annonces de l'Institut</h2>
        </div>
      </div>
    </section>

    <!-- Bas : partie ÉTUDIANT -->
    <section class="pres-card student">
      <span class="tape"></span>
      <span class="pres-tag"><i></i>Partie étudiant</span>
      <div class="pres-row">
        <!-- Vrai logo Sweeted -->
        <img class="sweeted-logo" src="sweeted_logo-no_background.png" alt="Logo Sweeted"/>
        <div>
          <h2>Publiez, commentez et partagez</h2>
        </div>
      </div>
    </section>
    </section>
  </aside>

  <!-- ============ DROITE : FORMULAIRE (inchangé, comme dans l'app) ============ -->
  <section class="auth">
    <div class="card">
      <div class="card-head">
        <img src="sweeted_logo-no_background.png" alt="Sweeted"/>
        <p class="motto">FAHAIZANA - FAMPANDROSOANA - FIHAVANANA</p>
      </div>

      <div class="card-body">
        <div class="tabs" role="tablist">
          <button class="tab on" data-m="log" role="tab" aria-selected="true">Connexion</button>
          <button class="tab" data-m="reg" role="tab" aria-selected="false">Inscription</button>
        </div>

        <form onsubmit="return false">
          <div class="field">
            <div class="lab"><label for="mat">Numéro matricule :</label></div>
            <div class="inp">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="mat" type="text" placeholder="Ex: 37-40014/24" autocomplete="username"/>
            </div>
          </div>

          <div class="field">
            <div class="lab">
              <label for="pw">Mot de passe :</label>
            </div>
            <div class="inp">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="pw" type="password" placeholder="••••••••••" autocomplete="current-password"/>
              <button class="eye" type="button" id="eye" aria-label="Afficher le mot de passe">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button class="submit" id="submit" type="submit">Se connecter</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script>
/* --- toggle Connexion / Inscription --- */
const tabs = document.querySelectorAll('.tab');
const submit = document.getElementById('submit');
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => { x.classList.toggle('on', x === t); x.setAttribute('aria-selected', x === t); });
  submit.textContent = t.dataset.m === 'log' ? 'Se connecter' : "S'inscrire";
}));

/* --- œil mot de passe --- */
const eye = document.getElementById('eye'), pw = document.getElementById('pw');
eye.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eye.style.color = show ? 'var(--green-deep)' : '';
});

/* --- petit feedback ludique au submit (visuel seulement) --- */
submit.addEventListener('click', () => {
  const old = submit.textContent;
  submit.textContent = 'Bienvenue ✎';
  submit.style.background = 'var(--green-dk)';
  setTimeout(() => { submit.textContent = old; submit.style.background = ''; }, 1200);
});
</script>
</body>
</html>
